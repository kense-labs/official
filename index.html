<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta name="color-scheme" content="dark only" />
    <script>
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.style.colorScheme = 'dark';
    </script>
  </head>
  <body>
    <div id="<%= mountId %>"></div>
  </body>
</html>
