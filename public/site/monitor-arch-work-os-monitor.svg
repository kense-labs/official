<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1088" height="560" viewBox="0 0 1088 560" fill="none">
  <defs>
    <style>
      .label { font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Inter, system-ui, sans-serif; }
      .eyebrow { fill: #9aabff; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; }
      .title { fill: #ffffff; font-size: 13px; font-weight: 600; }
      .brand { fill: #ffffff; font-size: 14px; font-weight: 600; }
      .tag { fill: #b4bad2; font-size: 10px; }
      .tag-strong { fill: #c8bfff; font-size: 10px; }
      .muted { fill: #8b90a5; font-size: 11px; }
      .core { fill: #ffffff; font-size: 14px; font-weight: 600; }
    </style>
    <linearGradient id="planeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c48"/>
      <stop offset="100%" stop-color="#101118"/>
    </linearGradient>
  </defs>

  <!-- outer connectors (behind cards) -->
  <g stroke="#4e60ff" stroke-opacity="0.4" stroke-width="1.25" fill="none">
    <path d="M544 78 L544 132"/>
    <path d="M250 203 C310 203, 340 210, 392 220"/>
    <path d="M250 293 C310 293, 340 270, 392 260"/>
    <path d="M250 383 C310 383, 340 320, 392 300"/>
    <path d="M696 220 C750 210, 790 203, 838 203"/>
    <path d="M696 260 C750 270, 790 293, 838 293"/>
    <path d="M696 300 C750 330, 790 383, 838 383"/>
    <path d="M420 428 L420 482"/>
    <path d="M668 428 L668 482"/>
  </g>

  <!-- TOP: Kense Work -->
  <g>
    <rect x="384" y="16" width="320" height="62" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.12"/>
    <text class="label eyebrow" x="544" y="36" text-anchor="middle">LOCAL ENTRY</text>
    <text class="label brand" x="544" y="58" text-anchor="middle">Kense Work</text>
    <rect x="540.5" y="74" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
  </g>
  <text class="label muted" x="544" y="98" text-anchor="middle">任务入口 · 人员 / 模型 / 工具</text>

  <!-- LEFT: Situation Monitor -->
  <g>
    <text class="label eyebrow" x="48" y="150">态势层</text>
    <g transform="translate(48,164)">
      <rect width="202" height="78" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="199" y="35.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="14" y="28">Ask · 问询</text>
      <rect x="14" y="40" width="52" height="18" rx="5" fill="#4e60ff" fill-opacity="0.12" stroke="#4e60ff" stroke-opacity="0.35"/>
      <text class="label tag-strong" x="22" y="53">自然语言</text>
      <rect x="72" y="40" width="40" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="label tag" x="80" y="53">证据</text>
    </g>
    <g transform="translate(48,254)">
      <rect width="202" height="78" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="199" y="35.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="14" y="28">Subscribe · 订阅</text>
      <rect x="14" y="40" width="44" height="18" rx="5" fill="#4e60ff" fill-opacity="0.12" stroke="#4e60ff" stroke-opacity="0.35"/>
      <text class="label tag-strong" x="20" y="53">Digest</text>
      <rect x="64" y="40" width="40" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="label tag" x="72" y="53">告警</text>
    </g>
    <g transform="translate(48,344)">
      <rect width="202" height="78" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="199" y="35.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="14" y="28">Build · 组装</text>
      <rect x="14" y="40" width="36" height="18" rx="5" fill="#4e60ff" fill-opacity="0.12" stroke="#4e60ff" stroke-opacity="0.35"/>
      <text class="label tag-strong" x="20" y="53">MCP</text>
      <rect x="56" y="40" width="36" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="label tag" x="62" y="53">API</text>
      <rect x="98" y="40" width="48" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="label tag" x="106" y="53">Widget</text>
    </g>
    <text class="label brand" x="149" y="458" text-anchor="middle">Kense Monitor</text>
    <text class="label muted" x="149" y="478" text-anchor="middle">态势 · 证据 · 只读接入</text>
  </g>

  <!-- CENTER: Kense OS — clean non-overlapping layout -->
  <g>
    <rect x="292" y="132" width="504" height="296" rx="16" fill="url(#planeGrad)" stroke="#4e60ff" stroke-opacity="0.5" stroke-width="1.25"/>
    <text class="label eyebrow" x="312" y="156">CONTROL PLANE</text>
    <text class="label brand" x="780" y="156" text-anchor="end">Kense OS</text>

    <!-- 2x2 nodes ABOVE core, no overlap -->
    <g transform="translate(316,174)">
      <rect width="168" height="40" rx="10" fill="#0b0c11" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="-3.5" y="16.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="84" y="25" text-anchor="middle">事件总线 · 订阅唤醒</text>
    </g>
    <g transform="translate(604,174)">
      <rect width="168" height="40" rx="10" fill="#0b0c11" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="164.5" y="16.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="84" y="25" text-anchor="middle">Durable Flow</text>
    </g>
    <g transform="translate(316,228)">
      <rect width="168" height="40" rx="10" fill="#0b0c11" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="-3.5" y="16.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="84" y="25" text-anchor="middle">AI Bot 集群</text>
    </g>
    <g transform="translate(604,228)">
      <rect width="168" height="40" rx="10" fill="#0b0c11" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="164.5" y="16.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="84" y="25" text-anchor="middle">权限 · 配额</text>
    </g>

    <!-- short stubs from nodes toward core (do not cross text) -->
    <g stroke="#4e60ff" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <path d="M400 268 L400 292"/>
      <path d="M688 268 L688 292"/>
      <path d="M400 292 L688 292"/>
    </g>

    <!-- core BELOW nodes, opaque so nothing shows through -->
    <g transform="translate(404,300)">
      <rect width="280" height="56" rx="28" fill="#1a2258" stroke="#4e60ff" stroke-width="1.5"/>
      <text class="label core" x="140" y="34" text-anchor="middle">编排 · 审批 · 发布</text>
    </g>

    <text class="label muted" x="544" y="400" text-anchor="middle">意图与策略在 OS；态势只读进入；写回走发布通道</text>
  </g>

  <!-- RIGHT: outputs -->
  <g>
    <text class="label eyebrow" x="838" y="150">落地出口</text>
    <g transform="translate(838,164)">
      <rect width="202" height="78" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="-4" y="35.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
