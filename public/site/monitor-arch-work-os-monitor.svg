      <rect x="14" y="40" width="40" height="18" rx="5" fill="#4e60ff" fill-opacity="0.12" stroke="#4e60ff" stroke-opacity="0.35"/>
      <text class="label tag-strong" x="20" y="53">研究</text>
      <rect x="60" y="40" width="40" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="label tag" x="68" y="53">回测</text>
    </g>
    <g transform="translate(838,254)">
      <rect width="202" height="78" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="-4" y="35.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="14" y="28">智能排产</text>
      <rect x="14" y="40" width="40" height="18" rx="5" fill="#4e60ff" fill-opacity="0.12" stroke="#4e60ff" stroke-opacity="0.35"/>
      <text class="label tag-strong" x="20" y="53">计划</text>
      <rect x="60" y="40" width="40" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="label tag" x="68" y="53">缓冲</text>
    </g>
    <g transform="translate(838,344)">
      <rect width="202" height="78" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="-4" y="35.5" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
      <text class="label title" x="14" y="28">业务系统写回</text>
      <rect x="14" y="40" width="52" height="18" rx="5" fill="#4e60ff" fill-opacity="0.12" stroke="#4e60ff" stroke-opacity="0.35"/>
      <text class="label tag-strong" x="20" y="53">publish</text>
      <rect x="72" y="40" width="36" height="18" rx="5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text class="label tag" x="78" y="53">审批</text>
    </g>
  </g>

  <!-- BOTTOM: Box + Sentry -->
  <g>
    <rect x="292" y="482" width="244" height="60" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="410.5" y="478" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
    <text class="label brand" x="414" y="508" text-anchor="middle">Kense Box</text>
    <text class="label muted" x="414" y="528" text-anchor="middle">MicroVM 隔离执行</text>

    <rect x="552" y="482" width="244" height="60" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="670.5" y="478" width="7" height="7" rx="1.5" fill="#0b0c11" stroke="#a8b0ff"/>
    <text class="label brand" x="674" y="508" text-anchor="middle">Kense Sentry</text>
    <text class="label muted" x="674" y="528" text-anchor="middle">L1–L3 运行时安保</text>
  </g>

  <g transform="translate(48,500)">
    <rect width="202" height="42" rx="12" fill="#101118" stroke="#ffffff" stroke-opacity="0.1"/>
    <text class="label tag-strong" x="16" y="26">ACL</text>
    <text class="label tag" x="52" y="26">CLI</text>
    <text class="label tag" x="84" y="26">SDK</text>
    <text class="label tag" x="118" y="26">MCP</text>
  </g>
</svg>
