  <!-- chart panel -->
  <rect x="300" y="160" width="640" height="320" rx="14" fill="#0e1018" stroke="#32384d"/>
  <path d="M340 420 C420 380, 480 400, 540 300 S680 220, 780 250 S880 180, 900 200" fill="none" stroke="#4e60ff" stroke-width="3"/>
  <path d="M340 430 H900" stroke="#32384d" stroke-width="1"/>
  <!-- side cards -->
  <rect x="970" y="160" width="350" height="150" rx="14" fill="#0e1018" stroke="#32384d"/>
