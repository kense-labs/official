<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-hidden="true">
  <rect width="1400" height="720" fill="#0b0c11"/>
  <rect x="40" y="40" width="1320" height="640" rx="20" fill="#12141c" stroke="#32384d"/>
