  <text x="995" y="235" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="15">Summarize filings + price shock</text>
  <text x="995" y="265" fill="#bcbbc9" font-family="Inter,system-ui,sans-serif" font-size="13">Evidence linked / ACL scoped</text>
  <rect x="970" y="330" width="350" height="150" rx="14" fill="#0e1018" stroke="#32384d"/>
  <text x="995" y="375" fill="#9aabff" font-family="Inter,system-ui,sans-serif" font-size="12">MCP / API</text>
  <text x="995" y="405" fill="#fff" font-family="Inter,system-ui,sans-serif" font-size="15">obb.equity.price.historical</text>
