<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="28%" stop-color="#e8ebf4" stop-opacity="0.42"/>
      <stop offset="58%" stop-color="#9aa3bc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#12141c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2030"/>
      <stop offset="100%" stop-color="#10131c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#glow)"/>

  <!-- Centered scene: content ~900px wide around x=800 -->
  <g transform="translate(800 372)" stroke="#0a0a0c" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- desk -->
    <path d="M-380 98 H-20" stroke-width="3.5"/>

    <!-- laptop -->
    <rect x="-330" y="-42" width="260" height="150" rx="10" stroke-width="3.2"/>
    <path d="M-350 118 H-50" stroke-width="4"/>
    <path d="M-310 -12 H-90 V68 H-310 Z" opacity="0.35" stroke-width="3.2"/>
    <rect x="-292" y="6" width="52" height="8" rx="2" fill="#ffffff" stroke="none"/>
    <rect x="-292" y="26" width="84" height="6" rx="2" fill="#ffffff" stroke="none" opacity="0.75"/>
    <rect x="-292" y="42" width="68" height="6" rx="2" fill="#ffffff" stroke="none" opacity="0.5"/>

    <!-- cables -->
    <g stroke-width="3">
      <path d="M-70 18 C40 -12, 120 -32, 240 -42"/>
      <path d="M-70 38 C50 28, 140 18, 240 8"/>
      <path d="M-70 58 C60 78, 160 98, 240 88"/>
      <path d="M-70 78 C70 118, 160 138, 240 128"/>
    </g>
    <g fill="#ffffff" stroke-width="2.5">
      <rect x="52" y="-20" width="16" height="16" rx="3"/>
      <rect x="128" y="20" width="16" height="16" rx="3"/>
      <rect x="104" y="86" width="16" height="16" rx="3"/>
    </g>

    <!-- OS tower -->
    <rect x="240" y="-122" width="210" height="280" rx="12" stroke-width="3.2"/>
    <path d="M260 -72 H430" stroke-width="3.2"/>
    <path d="M260 -12 H430" stroke-width="3.2"/>
    <path d="M260 48 H430" stroke-width="3.2"/>
    <circle cx="282" cy="-94" r="5" fill="#0a0a0c" stroke="none"/>
    <circle cx="302" cy="-94" r="5" fill="#0a0a0c" stroke="none"/>
    <rect x="324" y="-100" width="56" height="12" rx="3" fill="#ffffff" stroke="#0a0a0c" stroke-width="2"/>
    <rect x="272" y="-50" width="28" height="18" rx="3" stroke-width="2.5"/>
    <rect x="312" y="-50" width="28" height="18" rx="3" stroke-width="2.5"/>
    <rect x="272" y="10" width="140" height="10" rx="3" fill="#ffffff" stroke="none"/>
    <rect x="272" y="32" width="96" height="8" rx="3" fill="#ffffff" stroke="none" opacity="0.7"/>
    <rect x="272" y="80" width="120" height="10" rx="3" fill="#ffffff" stroke="none" opacity="0.55"/>

    <!-- capability panel -->
    <g transform="translate(448 -94)">
      <rect x="0" y="24" width="72" height="96" rx="8" fill="#ffffff" stroke-width="3"/>
      <circle cx="36" cy="12" r="16" fill="#ffffff" stroke-width="3"/>
      <path d="M36 5 L38.5 11.5 L45.5 12 L40 16.5 L41.8 23.5 L36 19.8 L30.2 23.5 L32 16.5 L26.5 12 L33.5 11.5 Z" fill="#0a0a0c" stroke="none"/>
    </g>
  </g>
</svg>
