<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="46%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="30%" stop-color="#e8ebf4" stop-opacity="0.45"/>
      <stop offset="62%" stop-color="#9aa3bc" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#12141c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2030"/>
      <stop offset="100%" stop-color="#10131c"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <rect width="960" height="640" fill="url(#glow)"/>

  <g transform="translate(480 330)" stroke="#0a0a0c" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- globe -->
    <circle cx="0" cy="8" r="118" stroke-width="3.4"/>
    <ellipse cx="0" cy="8" rx="48" ry="118" stroke-width="3"/>
    <path d="M-110 8 H110" stroke-width="3"/>
    <path d="M-98 -48 H98" stroke-width="2.8"/>
    <path d="M-98 64 H98" stroke-width="2.8"/>
    <!-- radar arcs -->
    <path d="M-150 -20 A152 152 0 0 1 40 -148" stroke-width="3" opacity="0.9"/>
    <path d="M-168 18 A170 170 0 0 1 58 -166" stroke-width="2.6" opacity="0.55"/>
    <path d="M0 8 L72 -132" stroke-width="3"/>
    <circle cx="72" cy="-132" r="7" fill="#0a0a0c" stroke="none"/>

    <!-- decision card -->
    <rect x="-78" y="-28" width="156" height="112" rx="12" fill="#ffffff" stroke-width="3.4"/>
    <circle cx="0" cy="-28" r="22" fill="#ffffff" stroke-width="3.2"/>
    <!-- eye / monitor mark -->
    <ellipse cx="0" cy="-28" rx="12" ry="8" stroke-width="2.8"/>
    <circle cx="0" cy="-28" r="3.5" fill="#0a0a0c" stroke="none"/>
    <!-- sparkle -->
    <path d="M0 -72 L3 -64 L12 -63 L5 -57 L7 -48 L0 -53 L-7 -48 L-5 -57 L-12 -63 L-3 -64 Z" fill="#0a0a0c" stroke="none"/>
    <!-- readout lines on card -->
    <path d="M-48 18 H48" stroke-width="3"/>
    <path d="M-48 40 H28" stroke-width="3" opacity="0.55"/>
    <path d="M-48 58 H40" stroke-width="3" opacity="0.35"/>
  </g>
</svg>
